name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test

      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: true

      - name: SpotBugs
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t authentication-api .

      - name: Build and start services
        run: docker compose up -d

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi-mysql 2>/dev/null)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs mysql-db
          exit 1

      - name: Grant MySQL permissions
        run: |
          SQL="DROP USER IF EXISTS 'appuser'@'%'; CREATE USER 'appuser'@'%' IDENTIFIED WITH mysql_native_password BY 'apppass'; GRANT ALL PRIVILEGES ON authdb.* TO 'appuser'@'%'; FLUSH PRIVILEGES;"
          echo "=== Granting appuser permissions ==="
          for i in $(seq 1 10); do
            echo "${SQL}" | docker exec -i authenticationapi-mysql \
              sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root' 2>/dev/null && {
              docker exec authenticationapi-mysql \
                sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -e "SELECT user, host, plugin FROM mysql.user WHERE user = '\''appuser'\'';"'
              exit 0
            }
            sleep 2
          done
          echo "Failed to grant MySQL permissions after 10 attempts"
          docker compose logs mysql-db
          exit 1

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi 2>/dev/null)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs java-api
          exit 1

      - name: Pre-test diagnostics
        run: |
          echo "=== Java API logs ==="
          docker compose logs java-api --tail 40
          echo ""
          echo "=== MySQL logs ==="
          docker compose logs mysql-db --tail 20
          echo ""
          echo "=== Healthcheck response (verbose) ==="
          curl -skv https://localhost:8443/v1/api/health 2>&1
          echo ""
          echo "=== Table check ==="
          docker exec authenticationapi-mysql \
            sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -e "USE authdb; SHOW TABLES; SELECT COUNT(*) AS user_count FROM users;"' 2>&1

      - name: Integration tests
        run: |
          set -eu
          API_BASE="https://localhost:8443"
          fail=false

          request_status() {
            local method=$1 path=$2
            shift 2
            curl -sk -o /dev/null -w "%{http_code}" -X "$method" "$@" "${API_BASE}${path}"
          }

          echo "=== 1. Register ==="
          code=$(request_status POST /v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","password":"testpass123"}')
          if [ "$code" != "201" ]; then echo "FAIL register: HTTP $code"; fail=true; else echo "OK (201)"; fi

          echo "=== 2. Login ==="
          out=$(curl -sk -X POST "${API_BASE}/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","password":"testpass123"}') || true
          TOKEN=$(echo "$out" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])" 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "FAIL login: $out"; fail=true
          else
            echo "OK, token length: ${#TOKEN}"
          fi

          echo "=== 3. Healthcheck ==="
          code=$(request_status GET /v1/api/health)
          if [ "$code" != "200" ]; then echo "FAIL healthcheck: HTTP $code"; fail=true; else echo "OK (200)"; fi

          echo "=== 4. Delete user ==="
          code=$(request_status DELETE /v1/auth/user/delete \
            -H "Authorization: Bearer $TOKEN")
          if [ "$code" != "200" ]; then echo "FAIL delete: HTTP $code"; fail=true; else echo "OK (200)"; fi

          if [ "$fail" = true ]; then
            echo ""
            echo "=== Some integration tests FAILED ==="
            echo ""
            echo "=== Post-failure logs (java-api) ==="
            docker compose logs java-api --tail 40
            exit 1
          fi
          echo ""
          echo "=== All integration tests passed ==="

      - name: Stop containers
        if: always()
        run: docker compose down -v || true
