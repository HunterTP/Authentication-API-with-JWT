name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t authentication-api .

      - name: Build Docker Compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi-mysql 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "MySQL failed to become healthy"
          docker compose logs mysql-db
          exit 1

      - name: Debug container
        run: |
          echo "=== Container status ==="
          docker ps -a --filter name=authenticationapi
          echo "=== Inspect ==="
          docker inspect authenticationapi --format='{{json .State}}' 2>/dev/null || echo "container not found"
          echo "=== Full logs ==="
          docker compose logs java-api 2>/dev/null || echo "no logs yet"

      - name: Wait for API
        run: |
          echo "Waiting for API to be healthy..."
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Waiting... ($i/60) status=$status"
            sleep 2
          done
          echo "API failed to become healthy"
          echo "--- Final container state ---"
          docker inspect authenticationapi --format='{{json .State}}' 2>/dev/null || echo "container not found"
          echo "--- Full logs ---"
          docker compose logs java-api
          exit 1

      - name: Check containers
        run: docker compose ps

      - name: Stop containers
        if: always()
        run: docker compose down -v || true