name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t authentication-api .

      - name: Build Docker Compose
        run: docker compose build

      - name: Start MySQL
        run: docker compose up -d mysql-db

      - name: Wait for MySQL
        run: sleep 15

      - name: Start Java API
        run: docker compose up -d java-api

      - name: Wait for API
        run: sleep 20

      - name: Check containers
        run: docker compose ps

      - name: Check health
        run: |
          docker inspect authenticationapi --format='{{.State.Status}}'
          docker inspect authenticationapi-mysql --format='{{.State.Health.Status}}'

      - name: Stop containers
        if: always()
        run: docker compose down -v