name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t authentication-api .

      - name: Direct container test
        run: |
          echo "=== Running container ==="
          docker run -d --name test-api authentication-api
          sleep 10
          echo "=== Container state ==="
          STATE=$(docker inspect test-api --format='{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}' 2>/dev/null)
          echo "::error title=Container State::$STATE"
          echo "=== Logs ==="
          LOGS=$(docker logs test-api 2>&1)
          echo "::error title=Container Logs::$LOGS"
          docker rm -f test-api 2>/dev/null

      - name: Build Docker Compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Check startup
        run: |
          echo "=== Compose PS ==="
          docker compose ps
          echo "=== API container state ==="
          docker inspect authenticationapi --format='{{json .State}}' 2>/dev/null || echo "not found"
          echo "=== API logs ==="
          docker compose logs --tail=15 java-api 2>/dev/null || echo "no logs"
          echo "=== MySQL logs ==="
          docker compose logs --tail=15 mysql-db 2>/dev/null || echo "no logs"

      - name: Wait for API
        run: |
          echo "Waiting 30s for API startup..."
          sleep 30
          docker inspect authenticationapi --format='{{json .State}}' 2>/dev/null || echo "not found"
          docker compose logs --tail=20 java-api 2>/dev/null || echo "no logs"
          echo "=== Health check ==="
          docker compose ps

      - name: Stop containers
        if: always()
        run: docker compose down -v || true