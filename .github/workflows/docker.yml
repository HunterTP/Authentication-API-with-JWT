name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t authentication-api .

      - name: Build and start services
        run: docker compose up -d

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi-mysql 2>/dev/null)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs mysql-db
          exit 1

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi 2>/dev/null)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs java-api
          exit 1

      - name: Check containers
        run: docker compose ps

      - name: Stop containers
        if: always()
        run: docker compose down -v || true
