name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp .env.example .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test

      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: true

      - name: SpotBugs
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t authentication-api .

      - name: Build and start services
        run: docker compose up -d

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi-mysql 2>/dev/null)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs mysql-db
          exit 1

      - name: Grant MySQL permissions
        run: |
          SQL="DROP USER IF EXISTS 'appuser'@'%'; CREATE USER 'appuser'@'%' IDENTIFIED WITH mysql_native_password BY 'apppass'; GRANT ALL PRIVILEGES ON authdb.* TO 'appuser'@'%'; FLUSH PRIVILEGES;"
          echo "=== Granting appuser permissions ==="
          for i in $(seq 1 10); do
            echo "${SQL}" | docker exec -i authenticationapi-mysql \
              sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root' 2>/dev/null && {
              docker exec authenticationapi-mysql \
                sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -e "SELECT user, host, plugin FROM mysql.user WHERE user = '\''appuser'\'';"'
              exit 0
            }
            sleep 2
          done
          echo "Failed to grant MySQL permissions after 10 attempts"
          docker compose logs mysql-db
          exit 1

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' authenticationapi 2>/dev/null)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs java-api
          exit 1

      - name: Check containers
        run: docker compose ps

      - name: Integration tests
        run: |
          echo "=== Register user ==="
          curl -sk -X POST https://localhost:8443/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","password":"testpass123"}' && echo ""

          echo "=== Login ==="
          TOKEN=$(curl -sk -X POST https://localhost:8443/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","password":"testpass123"}' | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['token'])" 2>/dev/null)
          echo "Token length: ${#TOKEN}"

          echo "=== Healthcheck ==="
          curl -sk https://localhost:8443/v1/api/health

          echo "=== Delete user ==="
          curl -sk -X DELETE https://localhost:8443/v1/auth/user/delete \
            -H "Authorization: Bearer $TOKEN"

          echo ""
          echo "=== All integration tests passed ==="

      - name: Stop containers
        if: always()
        run: docker compose down -v || true
