services:
  mysql-db:
    image: mysql:8.0.33
    container_name: authenticationapi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PWD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-authdb}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
      - ./mysql-config/custom.cnf:/etc/mysql/conf.d/custom.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      start_period: 10s
      timeout: 10s
      retries: 5

  java-api:
    build: .
    container_name: authenticationapi
    restart: unless-stopped
    ports:
      - "${API_PORT:-8443}:8443"
    depends_on:
      mysql-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database connection (internal Hostname)
      DB_URL: jdbc:mysql://mysql-db:3306/${DB_NAME:-authdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      
      # BCrypt Pepper
      BCRYPT_PEPPER: ${BCRYPT_PEPPER}
      BCRYPT_WORKLOAD: ${BCRYPT_WORKLOAD:-12}
      
      # Keystore pass
      KEYSTORE_PASS: ${KEYSTORE_PASS}
      KEY_PASS: ${KEY_PASS}
      storepass: ${KEYSTORE_PASS}
      keypass: ${KEY_PASS}
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "-s", "-o", "/dev/null", "https://localhost:8443/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10

volumes:
  mysql-data:
