services:
  mysql-db:
    image: mysql:8.0.33
    container_name: Authenticationapi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}  # .env!
      MYSQL_DATABASE: ${DB_NAME:-authenticationapi}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppass}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d  # Initialisingsskripte
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      timeout: 10s
      retries: 5

  java-api:
    build: .
    container_name: Authenticationapi
    restart: unless-stopped
    ports:
      - "${API_PORT:-8443}:8443"
    depends_on:
      mysql-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database connection (internal Hostname)
      DB_URL: jdbc:mysql://mysql-db:3306/${DB_NAME:-authdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      
      # BCrypt Pepper
      BCRYPT_PEPPER: ${BCRYPT_PEPPER}
      BCRYPT_WORKLOAD: ${BCRYPT_WORKLOAD:-12}
      
      # Keystore pass
      KEYSTORE_PASS: ${KEYSTORE_PASS}
      KEY_PASS: ${KEY_PASS}
      storepass: ${KEYSTORE_PASS}
      keypass: ${KEY_PASS}
    volumes:
      # Zertifikat from outside mounten (optional)
      - ${KEYSTORE_PATH:-./keystore.jks}:/app/keystore.jks:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O-", "https://localhost:8443/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql-data:
